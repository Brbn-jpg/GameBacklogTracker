services:
  gamebacklog_db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - ../.env

  gamebacklog_redis_cache:
    image: redis:6.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - cache:/data
    env_file:
      - ../.env

  gamebacklog_backend:
    build: ./
    ports:
      - "8080:8080"
    depends_on:
      - gamebacklog_db
      - gamebacklog_redis_cache
    env_file:
      - ../.env

volumes:
  pgdata: {}
  cache:
    driver: local
