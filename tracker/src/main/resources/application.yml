spring:
  application:
    name: game-backlock-tracker
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:gamebacklog_redis_cache}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  servlet:
    multipart:
      max-file-size: 400MB
      max-request-size: 400MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GOOGLE_SMTP_EMAIL}
    password: ${GOOGLE_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  servlet:
    context-path: /v1

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

igdb:
  api-url: https://api.igdb.com/v4
  auth-url: https://id.twitch.tv/oauth2/token
  client-id: ${IGDB_CLIENT_ID}
  client-secret: ${IGDB_CLIENT_SECRET}
